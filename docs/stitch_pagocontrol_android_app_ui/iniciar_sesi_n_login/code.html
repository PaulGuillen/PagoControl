<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-tint": "#765b00", "tertiary-fixed": "#ffdad7", "secondary-container": "#94f6c4", "surface-dim": "#d9dbd4", "surface": "#f9faf3", "secondary": "#006c48", "on-primary-container": "#6b5200", "on-primary": "#ffffff", "on-tertiary-container": "#9f292a", "on-secondary-container": "#00734d", "outline-variant": "#d1c5ae", "surface-container": "#edefe8", "tertiary": "#ac3231", "error": "#ba1a1a", "on-error": "#ffffff", "on-secondary": "#ffffff", "surface-container-highest": "#e1e3dc", "secondary-fixed": "#94f6c4", "on-tertiary": "#ffffff", "primary-container": "#f4c542", "surface-container-low": "#f3f4ed", "on-primary-fixed-variant": "#594400", "surface-container-high": "#e7e9e2", "outline": "#807662", "inverse-surface": "#2e312d", "on-secondary-fixed": "#002113", "background": "#f9faf3", "surface-container-lowest": "#ffffff", "primary-fixed-dim": "#efc13e", "primary-fixed": "#ffdf94", "surface-variant": "#e1e3dc", "on-tertiary-fixed-variant": "#8b191d", "on-background": "#191c18", "on-tertiary-fixed": "#410004", "primary": "#765b00", "on-secondary-fixed-variant": "#005236", "on-error-container": "#93000a", "on-surface-variant": "#4e4634", "secondary-fixed-dim": "#78d9aa", "surface-bright": "#f9faf3", "tertiary-fixed-dim": "#ffb3ae", "inverse-on-surface": "#f0f1ea", "on-primary-fixed": "#241a00", "on-surface": "#191c18", "error-container": "#ffdad6", "inverse-primary": "#efc13e", "tertiary-container": "#ffbab5" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin-tablet": "1.5rem", "gutter": "1rem", "space-lg": "1.5rem", "space-xs": "0.25rem", "gutter-sm": "0.75rem", "margin": "1rem", "space-sm": "0.5rem", "space-md": "1rem", "space-xl": "2rem" }, fontFamily: { "body-lg": ["Manrope"], "body-md": ["Manrope"], "headline-lg": ["Manrope"], "display-currency": ["Manrope"], "headline-md": ["Manrope"], "label-lg": ["Manrope"], "display-currency-mobile": ["Manrope"], "headline-sm": ["Manrope"], "label-md": ["Manrope"], "label-sm": ["Manrope"], "title-md": ["Manrope"], "body-sm": ["Manrope"], "currency-tabular": ["Manrope"] }, fontSize: { "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "headline-lg": ["28px", { lineHeight: "36px", fontWeight: "700" }], "display-currency": ["38px", { lineHeight: "44px", fontWeight: "800" }], "headline-md": ["22px", { lineHeight: "28px", fontWeight: "700" }], "label-lg": ["14px", { lineHeight: "20px", fontWeight: "600" }], "display-currency-mobile": ["30px", { lineHeight: "36px", fontWeight: "800" }], "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }], "label-md": ["12px", { lineHeight: "16px", fontWeight: "600" }], "label-sm": ["10px", { lineHeight: "14px", fontWeight: "700" }], "title-md": ["16px", { lineHeight: "22px", fontWeight: "600" }], "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }], "currency-tabular": ["16px", { lineHeight: "22px", fontWeight: "700" }] } } } }</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-14 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Volver" class="w-11 h-11 -ml-space-xs rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors" onclick="window.history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">Registro De Cuenta</h1></div><div class="flex items-center gap-space-xs"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col flex-1 relative w-full pt-14 pb-safe bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Brand Icon & Header -->
<div class="flex flex-col items-center text-center mt-space-lg mb-space-lg">
<div class="relative w-16 h-16 rounded-xl bg-primary-container flex items-center justify-center shadow-md mb-space-md transition-transform active:scale-95">
<span class="material-symbols-outlined text-[32px] text-on-surface" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<div class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-secondary flex items-center justify-center">
<span class="material-symbols-outlined text-[10px] text-on-secondary">bolt</span>
</div>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">Bienvenido de nuevo</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs">Ingresa a tu cuenta para continuar</p>
</div>
<!-- Social Login Button (Google) -->
<button class="w-full h-[52px] bg-surface-container-lowest active:bg-surface-container rounded-xl flex items-center justify-center gap-space-sm shadow-sm transition-all active:scale-[0.99] select-none" type="button">
<svg aria-hidden="true" class="w-5 h-5 flex-shrink-0" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17Z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24Z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15Z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z" fill="#EA4335"></path>
</svg>
<span class="font-label-lg text-label-lg text-on-surface">Continuar con Google</span>
</button>
<!-- Clean Divider -->
<div class="flex items-center my-space-lg">
<div class="flex-1 h-[1px] bg-surface-container-highest"></div>
<span class="px-space-md font-body-sm text-body-sm text-outline">o con tu correo</span>
<div class="flex-1 h-[1px] bg-surface-container-highest"></div>
</div>
<!-- Direct Login Form -->
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<!-- Input 1: Correo o Celular -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="identifier">Correo electrónico o celular</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-outline pointer-events-none text-[20px]">alternate_email</span>
<input autocomplete="username" class="w-full h-14 pl-12 pr-space-md bg-surface-container rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors" id="identifier" placeholder="ejemplo@correo.com o 987 654 321" type="text"/>
</div>
</div>
<!-- Input 2: Contraseña -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-outline pointer-events-none text-[20px]">lock</span>
<input autocomplete="current-password" class="w-full h-14 pl-12 pr-12 bg-surface-container rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors" id="password" placeholder="Ingresa tu contraseña" type="password"/>
<button aria-label="Mostrar u ocultar contraseña" class="absolute right-space-xs w-11 h-11 flex items-center justify-center text-outline hover:text-on-surface active:scale-95 transition-all" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Utility Row -->
<div class="flex items-center justify-between pt-space-xs">
<label class="flex items-center gap-space-sm cursor-pointer select-none">
<input checked="" class="w-5 h-5 rounded accent-primary-container cursor-pointer" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant">Recordarme</span>
</label>
<button class="font-label-md text-label-md text-on-surface hover:text-primary transition-colors" type="button">
        ¿Olvidaste tu contraseña?
      </button>
</div>
<!-- Primary Submit Button -->
<button class="mt-space-sm w-full h-[52px] bg-primary-container active:bg-primary-fixed-dim text-on-surface rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-md transition-all active:scale-[0.99] select-none" type="submit">
<span>Iniciar Sesión</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Biometric Access -->
<div class="mt-space-lg flex flex-col items-center">
<button class="w-full py-space-sm px-space-md bg-surface-container-low active:bg-surface-container-high rounded-xl flex items-center justify-center gap-space-sm transition-all active:scale-[0.99]" id="biometricButton" type="button">
<div class="w-9 h-9 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined text-[20px]">fingerprint</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Ingresar con huella digital</span>
</button>
</div>
<!-- Sign up Link Footer -->
<div class="mt-space-xl flex items-center justify-center gap-space-xs text-center">
<span class="font-body-md text-body-md text-on-surface-variant">¿No tienes cuenta?</span>
<button class="font-label-lg text-label-lg text-on-surface underline underline-offset-4 active:text-primary transition-colors" type="button">
      Regístrate aquí
    </button>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const biometricBtn = document.getElementById('biometricButton');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (biometricBtn) {
      biometricBtn.addEventListener('click', () => {
        const iconContainer = biometricBtn.querySelector('div');
        if (iconContainer) {
          iconContainer.classList.add('scale-125');
          setTimeout(() => {
            iconContainer.classList.remove('scale-125');
          }, 200);
        }
      });
    }
  })();
</script></main></body></html>
