 "space-xl": "2rem" }, fontFamily: { "body-lg": ["Manrope"], "body-md": ["Manrope"], "headline-lg": ["Manrope"], "display-currency": ["Manrope"], "headline-md": ["Manrope"], "label-lg": ["Manrope"], "display-currency-mobile": ["Manrope"], "headline-sm": ["Manrope"], "label-md": ["Manrope"], "label-sm": ["Manrope"], "title-md": ["Manrope"], "body-sm": ["Manrope"], "currency-tabular": ["Manrope"] }, fontSize: { "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "headline-lg": ["28px", { lineHeight: "36px", fontWeight: "700" }], "display-currency": ["38px", { lineHeight: "44px", fontWeight: "800" }], "headline-md": ["22px", { lineHeight: "28px", fontWeight: "700" }], "label-lg": ["14px", { lineHeight: "20px", fontWeight: "600" }], "display-currency-mobile": ["30px", { lineHeight: "36px", fontWeight: "800" }], "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }], "label-md": ["12px", { lineHeight: "16px", fontWeight: "600" }], "label-sm": ["10px", { lineHeight: "14px", fontWeight: "700" }], "title-md": ["16px", { lineHeight: "22px", fontWeight: "600" }], "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }], "currency-tabular": ["16px", { lineHeight: "22px", fontWeight: "700" }] } } } }</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-14 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Volver" class="w-11 h-11 -ml-space-xs rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors" onclick="window.history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">Registro De Cuenta</h1></div><div class="flex items-center gap-space-xs"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col flex-1 relative w-full pt-14 pb-safe bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Minimalist Brand Header -->
<div class="flex flex-col items-center text-center mt-space-md mb-space-lg">
<div class="w-14 h-14 rounded-2xl bg-primary-container flex items-center justify-center shadow-md mb-space-sm transform active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface text-[32px]" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface tracking-tight">Crea tu cuenta</h2>
<p class="font-body-md text-body-md text-outline mt-space-xs">Gestiona tus finanzas en segundos</p>
</div>
<!-- Social Quick Action -->
<button class="w-full h-13 py-3 px-space-md bg-surface-container-lowest text-on-surface rounded-xl flex items-center justify-center gap-space-sm shadow-sm active:bg-surface-container transition-all" type="button">
<svg aria-hidden="true" class="w-5 h-5" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.97 0 12s.45 3.84 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span class="font-label-lg text-label-lg">Continuar con Google</span>
</button>
<!-- Divider -->
<div class="flex items-center my-space-lg gap-space-sm">
<div class="h-[1px] flex-1 bg-surface-container-highest"></div>
<span class="font-body-sm text-body-sm text-outline px-space-xs">o regístrate con tus datos</span>
<div class="h-[1px] flex-1 bg-surface-container-highest"></div>
</div>
<!-- Ultra-Minimal 3-Field Form -->
<form class="flex flex-col gap-space-md" id="registerForm" onsubmit="event.preventDefault();">
<!-- Field 1: Nombre completo -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-space-xs" for="fullName">Nombre completo</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-outline text-[20px] pointer-events-none">person</span>
<input autocomplete="name" class="w-full h-14 pl-12 pr-space-md bg-surface-container rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-low transition-colors" id="fullName" placeholder="Tu nombre y apellido" type="text"/>
</div>
</div>
<!-- Field 2: Correo electrónico -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-space-xs" for="email">Correo electrónico</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-outline text-[20px] pointer-events-none">mail</span>
<input autocomplete="email" class="w-full h-14 pl-12 pr-space-md bg-surface-container rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-low transition-colors" id="email" placeholder="correo@ejemplo.com" type="email"/>
</div>
</div>
<!-- Field 3: Contraseña -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-space-xs" for="password">Contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-outline text-[20px] pointer-events-none">lock</span>
<input autocomplete="new-password" class="w-full h-14 pl-12 pr-12 bg-surface-container rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-low transition-colors" id="password" placeholder="Mínimo 8 caracteres" type="password"/>
<button aria-label="Alternar visibilidad de contraseña" class="absolute right-space-sm p-space-xs text-outline hover:text-on-surface transition-colors flex items-center justify-center" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
<!-- Minimalist Password Strength Meter -->
<div class="flex items-center gap-1.5 px-space-xs pt-1">
<div class="h-1 flex-1 rounded-full bg-surface-container-highest transition-colors" id="bar1"></div>
<div class="h-1 flex-1 rounded-full bg-surface-container-highest transition-colors" id="bar2"></div>
<div class="h-1 flex-1 rounded-full bg-surface-container-highest transition-colors" id="bar3"></div>
<div class="h-1 flex-1 rounded-full bg-surface-container-highest transition-colors" id="bar4"></div>
</div>
</div>
<!-- Single-line Terms Checkbox -->
<label class="flex items-center gap-space-sm cursor-pointer select-none px-space-xs mt-space-xs">
<input class="w-4 h-4 rounded text-primary-container focus:ring-0 focus:outline-none accent-[#f4c542] cursor-pointer" id="termsCheck" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">
        Acepto los <span class="text-on-surface font-label-sm underline underline-offset-2">Términos</span> y la <span class="text-on-surface font-label-sm underline underline-offset-2">Política de Privacidad</span>
</span>
</label>
<!-- Main Call to Action Button -->
<button class="w-full h-13 mt-space-sm bg-primary-container text-on-surface font-label-lg text-label-lg rounded-xl flex items-center justify-center gap-space-sm shadow-md active:bg-primary-fixed-dim transform active:scale-[0.99] transition-all" id="submitBtn" type="submit">
<span>Crear cuenta</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Clean Minimal Footer -->
<div class="flex items-center justify-center gap-1 mt-space-xl text-center">
<span class="font-body-md text-body-md text-outline">¿Ya tienes una cuenta?</span>
<button class="font-label-lg text-label-lg text-on-surface font-bold hover:underline focus:outline-none p-1" type="button">
      Iniciar Sesión
    </button>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const bars = [
      document.getElementById('bar1'),
      document.getElementById('bar2'),
      document.getElementById('bar3'),
      document.getElementById('bar4')
    ];

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (passwordInput) {
      passwordInput.addEventListener('input', (e) => {
        const val = e.target.value;
        const length = val.length;
        let score = 0;

        if (length >= 8) score++;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
        if (/\d/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        bars.forEach((bar, idx) => {
          bar.className = 'h-1 flex-1 rounded-full transition-colors';
          if (idx < score) {
            if (score <= 1) {
              bar.classList.add('bg-error');
            } else if (score <= 3) {
              bar.classList.add('bg-primary-container');
            } else {
              bar.classList.add('bg-secondary');
            }
          } else {
            bar.classList.add('bg-surface-container-highest');
          }
        });
      });
    }
  })();
</script></main></body></html>
